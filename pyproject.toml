[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-aging-msi"
version = "0.1.0"
description = "Exploratory spatial molecular analysis of young and old mouse hearts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
